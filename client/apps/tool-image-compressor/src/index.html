    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Acklet Image Compressor",
        "url": "https://imagecompressor.acklet.com/",

        },

          "100% In-Browser Client-Side Processing (0 Server Uploads)",
          "Target File Size Bounded Optimization",
          "Perceptual SSIM & PSNR Quality Metrics",

          "EXIF & GPS Location Metadata Stripping",
          "Bulk Batch Processing up to 50 Images",
          "ZIP Archive One-Click Download"
        ]
      }
    </script>

    <!-- Acklet Capsule Support -->
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          if (hash.startsWith('#acklet-cap=')) {
            var raw = hash.slice('#acklet-cap='.length);
            var parts = raw.split(',');
            if (parts.length === 5) {
              var nums = parts.map(function(n) { return parseInt(n, 10); });
              if (!nums.some(isNaN) && nums[2] > 0 && nums[3] > 0) {
                var vw = window.innerWidth || 1920;
                var vh = window.innerHeight || 1080;
                window.__acklet_capsule = {
                  x: Math.max(-vw, Math.min(vw * 2, nums[0])),
                  y: Math.max(-vh, Math.min(vh * 2, nums[1])),
                  w: Math.min(vw * 2, nums[2]),
                  h: Math.min(vh * 2, nums[3]),
                  r: Math.min(100, Math.max(0, nums[4]))
                };
              }
            }
            var cleanUrl = window.location.pathname + window.location.search;
            window.history.replaceState(null, '', cleanUrl);
          }
          if (window.__acklet_capsule) {
            document.documentElement.style.backgroundColor = document.documentElement.getAttribute('data-theme') === 'dark' ? '#141414' : '#FFFFFF';
          }
        } catch (e) {}
      })();
    </script>
