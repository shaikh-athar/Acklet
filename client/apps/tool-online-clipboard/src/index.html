<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Online Clipboard — Share Text, Images and Files Between Devices</title>
    <meta name="description" content="Share text, links, images and files between any two devices with a 5-digit code. Up to 200 MB per file, no signup required." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          if (hash.startsWith('#acklet-cap=')) {
            var raw = hash.slice('#acklet-cap='.length);
            var parts = raw.split(',');
            if (parts.length === 5) {
              var nums = parts.map(function(n) { return parseInt(n, 10); });
              if (!nums.some(isNaN) && nums[2] > 0 && nums[3] > 0) {
                var vw = window.innerWidth || 1920;
                var vh = window.innerHeight || 1080;
                window.__acklet_capsule = {
                  x: Math.max(-vw, Math.min(vw * 2, nums[0])),
                  y: Math.max(-vh, Math.min(vh * 2, nums[1])),
                  w: Math.min(vw * 2, nums[2]),
                  h: Math.min(vh * 2, nums[3]),
                  r: Math.min(100, Math.max(0, nums[4]))
                };
              }
            }
            var cleanUrl = window.location.pathname + window.location.search;
            window.history.replaceState(null, '', cleanUrl);
          }
          if (window.__acklet_capsule) {
            document.documentElement.style.backgroundColor = document.documentElement.getAttribute('data-theme') === 'dark' ? '#141414' : '#FFFFFF';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
