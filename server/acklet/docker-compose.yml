services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acklet-local-postgres
    environment:
      POSTGRES_DB: acklet
      POSTGRES_USER: acklet
      POSTGRES_PASSWORD: acklet_secret_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - acklet_container

  redis:
    image: redis:7-alpine
    container_name: acklet-local-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - acklet_container

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: acklet-local-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # RabbitMQ Web Management Dashboard UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - acklet_container

networks:
  acklet_container:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata: