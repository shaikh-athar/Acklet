services:
  postgres:
    image: postgres:16-alpine
    container_name: acklet-local-postgres
    environment:
      POSTGRES_DB: acklet
      POSTGRES_USER: acklet
      POSTGRES_PASSWORD: acklet_secret_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - acklet_container

  redis:
    image: redis:7-alpine
    container_name: acklet-local-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - acklet_container

networks:
  acklet_container:
    driver: bridge

volumes:
  pgdata:
  redisdata: