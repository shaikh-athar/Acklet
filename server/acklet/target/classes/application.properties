server.port=8080

# Spring Application
spring.application.name=acklet

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:acklet}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:acklet}
spring.datasource.password=${DB_PASSWORD:acklet_secret_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=*:ignored
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# CORS Configuration
cors.allowed-origins=http://localhost:4200,http://localhost:3000

# Application Security & JWT Properties
app.security.jwt.secret=${JWT_SECRET:9a2f8c4e6b1d5a7f3e8c0b2d4f6a8e1c3b5d7f9e2a4c6b8d0e2f4a6b8c0d2e4f}
app.security.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
app.security.encryption.key=${APP_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}

# Multipart File Upload Configuration (200MB per file, 500MB per request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=500MB
server.tomcat.max-http-form-post-size=500MB

# QR Generator Hosted Short-Link Configuration
app.qr.link.shortlink-base-url=${QR_PUBLIC_BASE_URL:http://localhost:8080/q}
app.qr.link.max-text-chars=20000
app.qr.link.max-url-chars=4000
app.qr.link.default-ttl-months=12
app.qr.link.create-rate-limit-per-minute=60

# URL Shortener Core Engine Configuration
app.shortener.base-url=${APP_SHORTENER_BASE_URL:http://localhost:8080/s}
app.shortener.code-length=6
app.shortener.default-expiry-days=365
app.shortener.max-expiry-days=730
app.shortener.purge-days=90
app.shortener.min-password-length=6
app.shortener.security.pepper=${APP_SHORTENER_PEPPER:0123456789abcdef0123456789abcdef}
app.shortener.security.unlock-signing-secret=${APP_SHORTENER_UNLOCK_SECRET:0123456789abcdef0123456789abcdef}
app.shortener.security.short-domains=urlshortener.localhost,localhost,acklet.com,acklet.dev
app.shortener.validation.block-private-targets=true
app.shortener.rate-limit.create-per-hour=20
app.shortener.rate-limit.unlock-failures-per-15-min=5
app.shortener.rate-limit.unlock-lockout-seconds=900

