server.port=8080

# Spring Application
spring.application.name=acklet

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:acklet}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:acklet}
spring.datasource.password=${DB_PASSWORD:acklet_secret_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# CORS Configuration
cors.allowed-origins=http://localhost:4200,http://localhost:3000

# Application Security & JWT Properties
app.security.jwt.secret=${JWT_SECRET:9a2f8c4e6b1d5a7f3e8c0b2d4f6a8e1c3b5d7f9e2a4c6b8d0e2f4a6b8c0d2e4f}
app.security.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
app.security.encryption.key=${APP_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}

# Multipart & Large File Upload Capacity (1 GB Max)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
server.tomcat.max-http-form-post-size=1024MB
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=60000

# RabbitMQ Configuration for Durable Event Delivery & Sync
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.template.retry.enabled=true

# Java 21+ Virtual Threads Activation
spring.threads.virtual.enabled=true

# Actuator & Observability Metrics for 100k Connection Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.metrics.tags.application=acklet
management.metrics.distribution.percentiles-histogram.airvault.ws.operation.duration=true

# ==============================================================================
# AirVault Object Storage Backend Configuration
# ==============================================================================
# Controls whether file storage uses local filesystem ('local') or Cloudflare R2 / AWS S3 ('s3' | 'r2').
airvault.storage.type=${STORAGE_TYPE:${STORAGE_BACKEND:local}}
airvault.storage.backend=${STORAGE_BACKEND:local}

# AWS S3 / Cloudflare R2 S3-Compatible Credentials
airvault.storage.s3.endpoint=${S3_ENDPOINT:${R2_CUSTOM_ENDPOINT:}}
airvault.storage.s3.access-key=${S3_ACCESS_KEY:${R2_ACCESS_KEY_ID:}}
airvault.storage.s3.secret-key=${S3_SECRET_KEY:${R2_SECRET_ACCESS_KEY:}}
airvault.storage.s3.bucket=${S3_BUCKET_NAME:${R2_BUCKET_NAME:acklet-airvault}}
airvault.storage.s3.region=${S3_REGION:auto}
airvault.storage.r2.account-id=${R2_ACCOUNT_ID:}

# ==============================================================================
# AirVault Storage Retention & Cleanup Engine Configuration
# ==============================================================================
# Path A: User-Facing File Retention (7-day recoverable grace period, 2-phase mark & sweep)
airvault.cleanup.files.dry-run=false
airvault.cleanup.files.grace-days=7
airvault.cleanup.files.retention-days=7

# Path B: Dead / Incomplete Upload Chunk Cleanup (Hourly immediate purge)
airvault.cleanup.chunks.dry-run=false
airvault.cleanup.chunks.grace-hours=2
airvault.cleanup.chunks.interval-ms=3600000

# Active In-Flight Write Grace Window (protects in-flight DB commits)
airvault.cleanup.active-grace-minutes=30
