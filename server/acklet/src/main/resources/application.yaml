spring:
  profiles:
    active: local

  application:
    name: acklet

  # Database configuration driver
  datasource:
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate base configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Use Flyway for migrations
    properties:
      hibernate:
        format_sql: false

  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    ignore-migration-patterns: "*:ignored"

  # Multipart upload limits
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 500MB

server:
  tomcat:
    max-swallow-size: 500MB
    max-http-form-post-size: 500MB

# Base Logging settings
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

app:
  converter:
    enabled: true
    dev-fallback: true
    max-file-size: 50MB
    temp-dir: ""
    timeout-seconds: 120
    libreoffice-path: ""
    async-threshold-bytes: 5242880 # 5MB
    job-ttl-minutes: 60
    cleanup-cron: "0 */15 * * * *"
