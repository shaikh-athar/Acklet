spring:
  # Database configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:acklet}
    username: ${DB_USER:acklet}
    password: ${DB_PASSWORD:acklet_secret_password}

