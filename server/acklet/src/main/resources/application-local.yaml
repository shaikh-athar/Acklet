spring:
  # Local Database configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:acklet}
    username: ${DB_USERNAME:acklet}
    password: ${DB_PASSWORD}

  # JPA & Hibernate configuration
  jpa:
    show-sql: false

  # Local Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Mail configuration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Local RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          max-interval: 10000ms
        auto-startup: true

# Logging settings for local environment
logging:
  level:
    root: INFO
    com.code.acklet: DEBUG
    org.springframework.security: INFO

# Application configurations for local environment (Secrets provided via environment variables)
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    encryption:
      key: ${APP_ENCRYPTION_KEY}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

  ai:
    mistral:
      api-key: ${MISTRAL_API_KEY:}
      model: ${MISTRAL_MODEL:mistral-small-latest}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
    executor:
      core-size: ${AI_EXECUTOR_CORE:2}
      max-size: ${AI_EXECUTOR_MAX:5}
      queue-capacity: ${AI_EXECUTOR_QUEUE:50}

  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
